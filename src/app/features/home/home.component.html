<div>
  <div style="font-family: Newsreader, Georgia, serif; font-size: 32px; line-height: 39px; font-weight: 500; letter-spacing: -.5px">
    {{ 'home.welcome' | translate }}, {{ patient()?.fullName }}
  </div>
  <div style="font-size: 14px; line-height: 21px; color: #6B7280; margin-top: 8px; max-width: 560px">
    {{ 'home.signedInBlurb' | translate }}
  </div>

  <button
    type="button"
    (click)="logout()"
    style="height: 44px; margin-top: 24px; padding: 0 20px; border: 1px solid #E3E9F2; border-radius: 12px; background: #fff; color: #1F2A37; font-size: 14px; font-weight: 600; cursor: pointer"
  >
    {{ 'account.logOut' | translate }}
  </button>
</div>
