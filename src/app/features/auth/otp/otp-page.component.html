<div style="max-width: 460px; margin: 0 auto; padding-top: 8px">
  <div (click)="backToAuth()" style="display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; color: #6B7280; cursor: pointer">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"></path></svg>
    Back
  </div>
  <div style="text-align: center; margin-top: 16px">
    <div style="font-family: Newsreader, Georgia, serif; font-size: 30px; line-height: 37px; font-weight: 500; letter-spacing: -.5px">{{ title() }}</div>
    <div style="font-size: 14px; line-height: 21px; color: #6B7280; margin-top: 6px">We sent a 6-digit code to {{ challenge()?.target }}</div>
  </div>

  <div style="background: #fff; border: 1px solid #E9EEF6; border-radius: 16px; box-shadow: 0 1px 2px rgba(13,27,42,.04), 0 12px 28px -20px rgba(16,42,84,.28); padding: 24px; margin-top: 20px">
    <div style="position: relative">
      <div style="display: flex; gap: 9px">
        @for (box of boxes(); track $index) {
          <div
            style="flex: 1; height: 56px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: #0B1526; border: 1.5px solid"
            [style.background]="box.bg"
            [style.border-color]="box.border"
          >
            {{ box.ch }}
          </div>
        }
      </div>
      <input
        [value]="otp()"
        (input)="onOtpInput($event)"
        inputmode="numeric"
        style="position: absolute; inset: 0; width: 100%; height: 56px; opacity: 0; border: 0; background: transparent; cursor: pointer"
      />
    </div>
    @if (otpError()) {
      <div style="font-size: 12px; line-height: 16px; color: #DC2626; margin-top: 10px">{{ otpError() }}</div>
    }
    <div (click)="resend()" style="font-size: 13px; line-height: 18px; color: #6B7280; margin-top: 14px; cursor: pointer">{{ resendLabel() }}</div>
    <button
      type="button"
      (click)="submitOtp()"
      [disabled]="submitting()"
      style="width: 100%; height: 48px; margin-top: 20px; border: 0; border-radius: 12px; background: #1A6DF0; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 8px 16px -8px rgba(16,63,151,.5)"
    >
      Verify and continue
    </button>
  </div>
</div>
