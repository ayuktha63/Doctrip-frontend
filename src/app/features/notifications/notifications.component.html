<div style="max-width: 780px">
  <div style="display: flex; align-items: flex-end; justify-content: space-between">
    <div>
      <div style="font-family: Newsreader, Georgia, serif; font-size: 32px; line-height: 39px; font-weight: 500; letter-spacing: -.5px">Notifications</div>
      <div style="font-size: 14px; color: #6B7280; margin-top: 5px">{{ countLabel() }}</div>
    </div>
    <button type="button" (click)="markAllRead()" style="height: 38px; padding: 0 15px; border: 1px solid #E3E9F2; border-radius: 10px; background: #fff; color: #1F2A37; font-size: 13px; font-weight: 600; cursor: pointer">Mark all as read</button>
  </div>

  <div style="background: #fff; border: 1px solid #E9EEF6; border-radius: 16px; box-shadow: 0 1px 2px rgba(13,27,42,.04), 0 12px 28px -20px rgba(16,42,84,.28); overflow: hidden; margin-top: 20px">
    @for (n of notifications(); track n.time) {
      <div (click)="open(n.to)" style="display: flex; gap: 14px; padding: 16px 20px; border-bottom: 1px solid #F4F7FC; cursor: pointer" [style.background]="n.bg">
        <div style="width: 36px; height: 36px; flex: none; border-radius: 18px; display: flex; align-items: center; justify-content: center" [style.background]="n.tint">
          <div style="width: 9px; height: 9px; border-radius: 5px" [style.background]="n.accent"></div>
        </div>
        <div style="flex: 1; min-width: 0">
          <div style="display: flex; align-items: baseline; gap: 10px">
            <div style="flex: 1; font-size: 14px; font-weight: 600">{{ n.title }}</div>
            <div style="flex: none; font-size: 11.5px; color: #9AA4B2">{{ n.time }}</div>
          </div>
          <div style="font-size: 13px; line-height: 19px; color: #6B7280; margin-top: 3px">{{ n.body }}</div>
        </div>
        @if (n.unread) {
          <div style="width: 8px; height: 8px; flex: none; border-radius: 4px; background: #1A6DF0; margin-top: 6px"></div>
        }
      </div>
    }
  </div>
</div>
