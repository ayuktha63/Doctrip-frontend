@if (toast.message()) {
  <div
    style="position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 70; display: flex; align-items: center; gap: 10px; background: #0B1526; color: #fff; border-radius: 12px; padding: 12px 18px; box-shadow: 0 18px 40px -16px rgba(13,27,42,.6)"
  >
    <svg
      width="17"
      height="17"
      viewBox="0 0 24 24"
      fill="none"
      stroke="#5EE9A6"
      stroke-width="2.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M20 6L9 17l-5-5"></path>
    </svg>
    <div style="font-size: 13.5px; font-weight: 500">{{ toast.message() }}</div>
  </div>
}
