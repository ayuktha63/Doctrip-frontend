@if (dialog.request(); as req) {
  <div
    (click)="dialog.close()"
    style="position: fixed; inset: 0; z-index: 60; background: rgba(13,27,42,.42); display: flex; align-items: center; justify-content: center"
  >
    <div (click)="stop($event)" style="width: 440px; background: #fff; border-radius: 16px; box-shadow: 0 24px 60px -20px rgba(13,27,42,.4); padding: 24px">
      <div
        style="width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center"
        [style.background]="req.tint"
      >
        <div style="width: 11px; height: 11px; border-radius: 6px" [style.background]="req.accent"></div>
      </div>
      <div style="font-family: Newsreader, Georgia, serif; font-size: 21px; line-height: 27px; font-weight: 500; margin-top: 14px">{{ req.title }}</div>
      <div style="font-size: 13.5px; line-height: 20px; color: #6B7280; margin-top: 7px">{{ req.body }}</div>
      <div style="display: flex; gap: 10px; margin-top: 22px">
        <button
          type="button"
          (click)="dialog.confirm()"
          style="flex: 1; height: 42px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; color: #fff"
          [style.background]="req.accent"
        >
          {{ req.actionLabel }}
        </button>
        <button
          type="button"
          (click)="dialog.close()"
          style="flex: 1; height: 42px; border: 1px solid #E3E9F2; border-radius: 10px; background: #fff; color: #1F2A37; font-size: 14px; font-weight: 600; cursor: pointer"
        >
          Keep as is
        </button>
      </div>
    </div>
  </div>
}
